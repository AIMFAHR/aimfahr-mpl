[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "aimfahr-mpl"
version = "1.1.0"
description = "Matplotlib styles and logos for AIMFAHR: dark and light themes; web, slides, poster and journal contexts."
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["matplotlib>=3.7", "numpy"]
license = {text = "MIT (code); SIL OFL 1.1 (bundled Montserrat font)"}
authors = [{name = "Kyle Murphy"}]
keywords = ["matplotlib", "style", "heliophysics", "space weather"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Framework :: Matplotlib",
    "Topic :: Scientific/Engineering :: Visualization",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/kylermurphy/aimfahr-mpl"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
aimfahr_mpl = ["*.mplstyle", "fonts/*.ttf", "fonts/OFL.txt", "logos/*.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]
